name: Test Web Build

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install

      - name: Build production app
        run: bun run build

      - name: Inspect build output
        run: |
          echo "========================================"
          echo "BUILD OUTPUT"
          echo "========================================"

          if [ ! -d ".output" ]; then
            echo "❌ .output directory was not created."
            exit 1
          fi

          find .output -maxdepth 6 -type f | sort

          echo "========================================"

      - name: Verify static web output
        run: |
          echo "========================================"
          echo "VERIFY STATIC WEB OUTPUT"
          echo "========================================"

          if [ ! -f ".output/public/index.html" ]; then
            echo "❌ ERROR: .output/public/index.html was NOT created."
            echo ""
            echo "The application is still producing server-only output."
            exit 1
          fi

          if [ ! -s ".output/public/index.html" ]; then
            echo "❌ ERROR: index.html is empty."
            exit 1
          fi

          JS_COUNT=$(find .output/public -type f \
            \( -name "*.js" -o -name "*.mjs" \) | wc -l)

          echo "index.html: FOUND"
          echo "JavaScript files: $JS_COUNT"

          if [ "$JS_COUNT" -eq 0 ]; then
            echo "❌ ERROR: No JavaScript files found."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "INDEX.HTML"
          echo "========================================"

          head -c 3000 .output/public/index.html

          echo ""
          echo "========================================"
          echo "✅ STATIC OUTPUT TEST PASSED"
          echo "========================================"

      - name: Upload web output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: faith-marker-web-output
          path: .output/public
          if-no-files-found: error

      - name: Final result
        if: success()
        run: |
          echo ""
          echo "========================================"
          echo "🎉 FAITH MARK STATIC BUILD PASSED"
          echo "========================================"
          echo ""
          echo "✓ Production build completed"
          echo "✓ index.html exists"
          echo "✓ JavaScript files exist"
          echo "✓ Static web output is ready"
          echo ""
          echo "NEXT: verify the output before Corenna APK."
          echo "========================================"
