name: Test Web Build

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production app
        run: bun run build

      - name: Show build output
        run: |
          echo "===== BUILD OUTPUT ====="
          find .output -maxdepth 4 -type f | sort || true
          echo "========================"

      - name: Verify index.html
        run: |
          if [ ! -f ".output/public/index.html" ]; then
            echo "❌ ERROR: .output/public/index.html was not created."
            exit 1
          fi

          if [ ! -s ".output/public/index.html" ]; then
            echo "❌ ERROR: index.html is empty."
            exit 1
          fi

          echo "✅ index.html exists and is not empty."

      - name: Verify JavaScript files
        run: |
          JS_COUNT=$(find .output/public -type f \( -name "*.js" -o -name "*.mjs" \) | wc -l)

          echo "JavaScript files found: $JS_COUNT"

          if [ "$JS_COUNT" -eq 0 ]; then
            echo "❌ ERROR: No JavaScript files were found."
            exit 1
          fi

          echo "✅ JavaScript files exist."

      - name: Verify web assets
        run: |
          echo "===== WEB FILES ====="
          find .output/public -type f | sort
          echo "===================="

      - name: Build test passed
        run: |
          echo "========================================"
          echo "✅ PRODUCTION WEB BUILD TEST PASSED"
          echo "========================================"
          echo "The web output contains:"
          echo "✓ index.html"
          echo "✓ JavaScript assets"
          echo "✓ production build completed"
