name: Test Web Build

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install

      - name: Build production app
        run: bun run build

      - name: Inspect build output
        run: |
          echo "========================================"
          echo "BUILD OUTPUT"
          echo "========================================"

          if [ ! -d ".output" ]; then
            echo "❌ ERROR: .output directory was not created."
            exit 1
          fi

          find .output -maxdepth 6 -type f | sort

          echo "========================================"

      - name: Check build output
        run: |
          if [ ! -d ".output" ]; then
            echo "❌ ERROR: .output directory does not exist."
            exit 1
          fi

          FILE_COUNT=$(find .output -type f | wc -l)

          echo "Files found in .output: $FILE_COUNT"

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "❌ ERROR: .output is empty."
            exit 1
          fi

          echo "✅ Production build created files successfully."

      - name: Find HTML files
        run: |
          echo "========================================"
          echo "HTML FILES"
          echo "========================================"

          HTML_COUNT=$(find .output -type f \( -name "*.html" -o -name "*.htm" \) | wc -l)

          echo "HTML files found: $HTML_COUNT"

          find .output -type f \( -name "*.html" -o -name "*.htm" \) | sort || true

          echo "========================================"

      - name: Find JavaScript files
        run: |
          echo "========================================"
          echo "JAVASCRIPT FILES"
          echo "========================================"

          JS_COUNT=$(find .output -type f \( -name "*.js" -o -name "*.mjs" \) | wc -l)

          echo "JavaScript files found: $JS_COUNT"

          find .output -type f \( -name "*.js" -o -name "*.mjs" \) | sort | head -100 || true

          echo "========================================"

          if [ "$JS_COUNT" -eq 0 ]; then
            echo "❌ ERROR: No JavaScript files found."
            exit 1
          fi

          echo "✅ JavaScript files exist."

      - name: Locate application entry
        run: |
          echo "========================================"
          echo "POSSIBLE APPLICATION ENTRY FILES"
          echo "========================================"

          find .output \
            -type f \
            \( -name "index.html" \
            -o -name "index.mjs" \
            -o -name "server.mjs" \
            -o -name "server.js" \
            -o -name "entry.mjs" \
            -o -name "entry.js" \) \
            | sort || true

          echo "========================================"

      - name: Final result
        run: |
          echo ""
          echo "========================================"
          echo "✅ PRODUCTION BUILD TEST PASSED"
          echo "========================================"
          echo ""
          echo "The application built successfully."
          echo "The .output directory contains build files."
          echo "JavaScript application files were found."
          echo ""
          echo "Next step: inspect the output before using Corenna."
          echo "========================================"
