name: Test Web Build

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install

      - name: Build production app
        run: bun run build

      - name: Check production output
        run: |
          echo "========================================"
          echo "PRODUCTION OUTPUT"
          echo "========================================"

          if [ ! -f ".output/server/index.mjs" ]; then
            echo "❌ Server entry was not created."
            exit 1
          fi

          if [ ! -d ".output/public" ]; then
            echo "❌ Public directory was not created."
            exit 1
          fi

          JS_COUNT=$(find .output/public -type f \( -name "*.js" -o -name "*.mjs" \) | wc -l)

          if [ "$JS_COUNT" -eq 0 ]; then
            echo "❌ No public JavaScript files found."
            exit 1
          fi

          echo "✅ Server entry exists."
          echo "✅ Public directory exists."
          echo "✅ Public JavaScript files exist: $JS_COUNT"

      - name: Start production server
        run: |
          node .output/server/index.mjs > server.log 2>&1 &
          echo $! > server.pid

          echo "Waiting for server..."

          for i in {1..30}; do
            if curl -s http://127.0.0.1:3000/ > response.html; then
              if [ -s response.html ]; then
                echo "✅ Server responded."
                break
              fi
            fi

            sleep 2
          done

          echo "========================================"
          echo "SERVER LOG"
          echo "========================================"
          cat server.log || true

          echo "========================================"
          echo "HTTP RESPONSE"
          echo "========================================"

          head -c 1000 response.html || true

          echo ""
          echo "========================================"

      - name: Verify HTML response
        run: |
          if [ ! -s response.html ]; then
            echo "❌ ERROR: Server returned no HTML response."
            exit 1
          fi

          if grep -qi "<html" response.html; then
            echo "✅ HTML document detected."
          else
            echo "❌ ERROR: Response does not contain an HTML document."
            exit 1
          fi

          if grep -qi "Faith Mark" response.html; then
            echo "✅ Faith Mark content detected."
          else
            echo "⚠️ Faith Mark text was not found in the first response."
          fi

      - name: Install Playwright
        run: |
          bun add -d playwright

      - name: Install Chromium
        run: |
          bunx playwright install --with-deps chromium

      - name: Test app in Chromium
        run: |
          cat > test-app.mjs <<'EOF'
          import { chromium } from "playwright";

          const browser = await chromium.launch({
            headless: true
          });

          const page = await browser.newPage();

          const errors = [];

          page.on("console", message => {
            if (message.type() === "error") {
              errors.push(`Console error: ${message.text()}`);
            }
          });

          page.on("pageerror", error => {
            errors.push(`Page error: ${error.message}`);
          });

          console.log("Opening Faith Mark...");

          const response = await page.goto(
            "http://127.0.0.1:3000/",
            {
              waitUntil: "networkidle",
              timeout: 30000
            }
          );

          console.log("HTTP status:", response?.status());

          await page.waitForTimeout(3000);

          const title = await page.title();
          const bodyText = await page.locator("body").innerText();

          console.log("Page title:", title);
          console.log("Body text length:", bodyText.length);

          if (!response || !response.ok()) {
            throw new Error("The application did not return a successful HTTP response.");
          }

          if (bodyText.trim().length === 0) {
            throw new Error("WHITE SCREEN DETECTED: body contains no visible text.");
          }

          if (errors.length > 0) {
            console.log("========================================");
            console.log("BROWSER ERRORS");
            console.log("========================================");

            for (const error of errors) {
              console.log(error);
            }

            throw new Error(
              `The application produced ${errors.length} browser error(s).`
            );
          }

          console.log("========================================");
          console.log("✅ BROWSER TEST PASSED");
          console.log("========================================");
          console.log("The page loaded successfully.");
          console.log("The page contains visible content.");
          console.log("No browser JavaScript errors were detected.");

          await browser.close();
          EOF

          node test-app.mjs

      - name: Final result
        run: |
          echo ""
          echo "========================================"
          echo "🎉 FAITH MARK WEB TEST PASSED"
          echo "========================================"
          echo ""
          echo "✓ Production build works"
          echo "✓ Server starts"
          echo "✓ HTML is returned"
          echo "✓ Faith Mark page loads"
          echo "✓ Page is not blank"
          echo "✓ No browser JavaScript errors"
          echo ""
          echo "SAFE TO PROCEED TO CORenna APK TEST"
          echo "========================================"
